---
- name: Install and configure Docker Engine
  hosts: docker_hosts
  become: true

  vars:
    docker_users:
      ubuntu_server: jurgen-ds-hop
      hp_observability: jurgen

  tasks:
    - name: Install prerequisite packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Check if Docker GPG key already exists
      stat:
        path: /etc/apt/keyrings/docker.gpg
      register: docker_gpg_key

    - name: Download Docker GPG key
      get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /tmp/docker.gpg.asc
      when: not docker_gpg_key.stat.exists

    - name: Dearmor Docker GPG key
      command: gpg --dearmor -o /etc/apt/keyrings/docker.gpg /tmp/docker.gpg.asc
      when: not docker_gpg_key.stat.exists

    - name: Ensure Docker GPG key is readable
      file:
        path: /etc/apt/keyrings/docker.gpg
        mode: "0644"

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch={{ ansible_architecture | regex_replace('x86_64', 'amd64') }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker service is enabled and running
      systemd:
        name: docker
        enabled: true
        state: started

    - name: Add user to docker group
      user:
        name: "{{ docker_users[group_names[1]] }}"
        groups: docker
        append: true
