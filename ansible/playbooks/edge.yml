---
- name: Deploy Toshiba Edge Node exporters
  hosts: toshiba_edge
  become: true

  vars:
    node_exporter_version: "1.8.2"
    blackbox_exporter_version: "0.25.0"

  tasks:
    - name: Create dedicated system users
      user:
        name: "{{ item }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false
      loop:
        - node_exporter
        - blackbox_exporter

    - name: Check if node_exporter binary exists
      stat:
        path: /usr/local/bin/node_exporter
      register: node_exporter_bin

    - name: Download and extract node_exporter
      unarchive:
        src: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-386.tar.gz"
        dest: /tmp
        remote_src: true
      when: not node_exporter_bin.stat.exists

    - name: Install node_exporter binary
      copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-386/node_exporter"
        dest: /usr/local/bin/node_exporter
        owner: node_exporter
        group: node_exporter
        mode: "0755"
        remote_src: true
      when: not node_exporter_bin.stat.exists

    - name: Check if blackbox_exporter binary exists
      stat:
        path: /usr/local/bin/blackbox_exporter
      register: blackbox_exporter_bin

    - name: Download and extract blackbox_exporter
      unarchive:
        src: "https://github.com/prometheus/blackbox_exporter/releases/download/v{{ blackbox_exporter_version }}/blackbox_exporter-{{ blackbox_exporter_version }}.linux-386.tar.gz"
        dest: /tmp
        remote_src: true
      when: not blackbox_exporter_bin.stat.exists

    - name: Install blackbox_exporter binary
      copy:
        src: "/tmp/blackbox_exporter-{{ blackbox_exporter_version }}.linux-386/blackbox_exporter"
        dest: /usr/local/bin/blackbox_exporter
        owner: blackbox_exporter
        group: blackbox_exporter
        mode: "0755"
        remote_src: true
      when: not blackbox_exporter_bin.stat.exists

    - name: Grant cap_net_raw to blackbox_exporter for ICMP probes
      community.general.capabilities:
        path: /usr/local/bin/blackbox_exporter
        capability: cap_net_raw+ep
        state: present

    - name: Create blackbox_exporter config directory
      file:
        path: /etc/blackbox_exporter
        state: directory
        owner: blackbox_exporter
        group: blackbox_exporter
        mode: "0755"

    - name: Deploy blackbox_exporter config
      template:
        src: ../templates/edge/blackbox.yml.j2
        dest: /etc/blackbox_exporter/blackbox.yml
        owner: blackbox_exporter
        group: blackbox_exporter
      notify: Restart blackbox_exporter

    - name: Deploy node_exporter systemd unit
      template:
        src: ../templates/edge/node_exporter.service.j2
        dest: /etc/systemd/system/node_exporter.service
      notify: Restart node_exporter

    - name: Deploy blackbox_exporter systemd unit
      template:
        src: ../templates/edge/blackbox_exporter.service.j2
        dest: /etc/systemd/system/blackbox_exporter.service
      notify: Restart blackbox_exporter

    - name: Reload systemd daemon
      systemd:
        daemon_reload: true

    - name: Ensure node_exporter is enabled and running
      systemd:
        name: node_exporter
        enabled: true
        state: started

    - name: Ensure blackbox_exporter is enabled and running
      systemd:
        name: blackbox_exporter
        enabled: true
        state: started

  handlers:
    - name: Restart node_exporter
      systemd:
        name: node_exporter
        state: restarted
        daemon_reload: true

    - name: Restart blackbox_exporter
      systemd:
        name: blackbox_exporter
        state: restarted
        daemon_reload: true
