---
- name: Deploy Ubuntu Server observability stack
  hosts: ubuntu_server
  become: true
  vars:
    home_dir: "/home/{{ ansible_user }}"

  tasks:
    - name: Create service directories
      file:
        path: "{{ home_dir }}/{{ item }}"
        state: directory
        owner: "{{ ansible_user }}"
        mode: "0755"
      loop:
        - observability/nginx
        - observability/cadvisor
        - observability/node-exporter

    - name: Deploy nginx compose file
      template:
        src: ../templates/monitoring/nginx-compose.yml.j2
        dest: "{{ home_dir }}/observability/nginx/docker-compose.yml"
        owner: "{{ ansible_user }}"

    - name: Deploy nginx config
      template:
        src: ../templates/monitoring/nginx.conf.j2
        dest: "{{ home_dir }}/observability/nginx/nginx.conf"
        owner: "{{ ansible_user }}"

    - name: Deploy cadvisor compose file
      template:
        src: ../templates/monitoring/cadvisor-compose.yml.j2
        dest: "{{ home_dir }}/observability/cadvisor/docker-compose.yml"
        owner: "{{ ansible_user }}"

    - name: Deploy node-exporter compose file
      template:
        src: ../templates/monitoring/node-exporter-compose.yml.j2
        dest: "{{ home_dir }}/observability/node-exporter/docker-compose.yml"
        owner: "{{ ansible_user }}"

    - name: Start nginx stack
      command: docker compose up -d
      args:
        chdir: "{{ home_dir }}/observability/nginx"

    - name: Start cadvisor stack
      command: docker compose up -d
      args:
        chdir: "{{ home_dir }}/observability/cadvisor"

    - name: Start node-exporter stack
      command: docker compose up -d
      args:
        chdir: "{{ home_dir }}/observability/node-exporter"


