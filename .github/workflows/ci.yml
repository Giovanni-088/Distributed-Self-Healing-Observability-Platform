name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: pip install ansible

      - name: Syntax check playbooks
        run: |
          cd ansible
          for playbook in playbooks/*.yml; do
            echo "Checking $playbook"
            ansible-playbook "$playbook" -i inventory/hosts.ini --syntax-check
          done

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install flake8
        run: pip install flake8

      - name: Lint watchdog Python code
        run: flake8 watchdog/python --max-line-length=120 --extend-ignore=E501,W503
